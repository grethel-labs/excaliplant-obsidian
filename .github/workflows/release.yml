name: Release

# This repository is a release mirror of https://github.com/grethel-labs/excaliplant
# (integrations/obsidian). The release workflow there pushes the built plugin
# files to main and then a tag equal to the manifest version (no "v", as
# Obsidian requires). This workflow turns that tag into the GitHub release
# with the assets Obsidian downloads: main.js, manifest.json and styles.css.

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the manifest
        run: |
          set -euo pipefail
          version=$(jq -r .version manifest.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          for f in main.js manifest.json styles.css; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" \
              --notes "Excaliplant $GITHUB_REF_NAME. Changelog and source: https://github.com/grethel-labs/excaliplant/releases/tag/v$GITHUB_REF_NAME"
          fi
